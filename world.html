<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1321" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dreamworld" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Dreamworld — World First</title>
  <style>
    :root {
      --night: #0d1321;
      --deep: #141d2b;
      --slate: #233242;
      --teal: #3e5b57;
      --sage: #8ea096;
      --paper: #e7dfc5;
      --gold: #b69a63;
      --line: rgba(231, 223, 197, .16);
      --danger: #9e665f;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--paper); }
    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

    .app {
      position: relative;
      width: min(100%, 430px);
      height: 100dvh;
      min-height: 620px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--night);
    }

    .boot {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: var(--night);
      animation: boot-away 1.8s steps(8, end) 1.1s forwards;
      pointer-events: none;
    }
    .boot-mark {
      position: relative;
      width: 46px;
      height: 46px;
      border: 4px solid var(--paper);
      transform: rotate(45deg);
      animation: mark-pulse 900ms steps(3) infinite;
    }
    .boot-mark::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      top: 8px;
      left: 8px;
      background: var(--gold);
    }

    .view {
      position: absolute;
      inset: 0 0 78px;
      display: none;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--night);
    }
    .view.active { display: block; animation: view-in 180ms ease-out both; }

    .world-view { overflow: hidden; }
    .world-scene { position: absolute; inset: 0; }
    .world-scene svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; image-rendering: pixelated; transition: filter 1.8s ease; }
    .app[data-phase="blue-hour"] .world-scene svg { filter: brightness(.92) saturate(.86); }
    .app[data-phase="sunrise"] .world-scene svg { filter: brightness(1.14) saturate(.9); }
    .app[data-phase="morning"] .world-scene svg { filter: brightness(1.32) saturate(.82); }
    .app[data-phase="noon"] .world-scene svg { filter: brightness(1.48) saturate(.72); }
    .app[data-phase="afternoon"] .world-scene svg { filter: brightness(1.3) saturate(.86); }
    .app[data-phase="golden-hour"] .world-scene svg { filter: brightness(1.14) saturate(.98); }
    .app[data-phase="sunset"] .world-scene svg { filter: brightness(.98) saturate(.92); }
    .app[data-phase="night"] .world-scene svg { filter: brightness(.78) saturate(.78); }
    .phase-wash { position: absolute; inset: 0; pointer-events: none; transition: background 1.8s ease, opacity 1.8s ease; mix-blend-mode: soft-light; }
    .stars-layer, .moon-body, .sun-body { transition: opacity 1.8s ease, transform 1.8s ease; transform-box: fill-box; transform-origin: center; }
    .sun-body { opacity: 0; }

    .app[data-phase="blue-hour"] .phase-wash { background: rgba(45, 68, 92, .26); }
    .app[data-phase="sunrise"] .phase-wash { background: rgba(182, 138, 92, .3); }
    .app[data-phase="morning"] .phase-wash { background: rgba(142, 160, 150, .18); }
    .app[data-phase="noon"] .phase-wash { background: rgba(231, 223, 197, .24); }
    .app[data-phase="afternoon"] .phase-wash { background: rgba(171, 159, 118, .18); }
    .app[data-phase="golden-hour"] .phase-wash { background: rgba(182, 154, 99, .34); }
    .app[data-phase="sunset"] .phase-wash { background: rgba(146, 91, 78, .3); }
    .app[data-phase="night"] .phase-wash { background: rgba(13, 19, 33, .12); }

    .app[data-phase="sunrise"] .moon-body,
    .app[data-phase="morning"] .moon-body,
    .app[data-phase="noon"] .moon-body,
    .app[data-phase="afternoon"] .moon-body,
    .app[data-phase="golden-hour"] .moon-body { opacity: 0; }
    .app[data-phase="sunrise"] .sun-body,
    .app[data-phase="morning"] .sun-body,
    .app[data-phase="noon"] .sun-body,
    .app[data-phase="afternoon"] .sun-body,
    .app[data-phase="golden-hour"] .sun-body { opacity: 1; }
    .app[data-phase="sunrise"] .sun-body { transform: translate(-180px, 155px); }
    .app[data-phase="morning"] .sun-body { transform: translate(-120px, 65px); }
    .app[data-phase="noon"] .sun-body { transform: translate(-45px, -10px); }
    .app[data-phase="afternoon"] .sun-body { transform: translate(15px, 45px); }
    .app[data-phase="golden-hour"] .sun-body { transform: translate(30px, 145px); }
    .app[data-phase="morning"] .stars-layer,
    .app[data-phase="noon"] .stars-layer,
    .app[data-phase="afternoon"] .stars-layer { opacity: 0; }
    .app[data-phase="sunrise"] .stars-layer,
    .app[data-phase="golden-hour"] .stars-layer { opacity: .18; }
    .app[data-phase="sunset"] .stars-layer { opacity: .45; }

    .world-hud {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .world-id, .world-progress {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(13,19,33,.78);
      color: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
    .world-progress { color: var(--sage); }

    .hotspot {
      position: absolute;
      z-index: 5;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .hotspot::before, .hotspot::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(231,223,197,.8);
      border-radius: 50%;
    }
    .hotspot::after { inset: 4px; opacity: .3; animation: ring 2.2s ease-out infinite; }
    .hotspot-arch { left: 49%; top: 47%; }
    .hotspot-tree { left: 25%; top: 56%; }

    .world-sheet {
      position: absolute;
      z-index: 8;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      background: rgba(13,19,33,.88);
      backdrop-filter: blur(10px);
      transform: translateY(calc(100% + 24px));
      transition: transform 220ms ease;
    }
    .world-sheet.visible { transform: translateY(0); }
    .world-sheet small { display: block; color: var(--sage); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .world-sheet strong { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; }
    .sheet-close { width: 36px; height: 36px; border: 1px solid var(--line); background: transparent; color: var(--paper); cursor: pointer; }

    .panel-view { padding: max(28px, env(safe-area-inset-top)) 18px 28px; }
    .panel-head { min-height: 44px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .panel-title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -.03em; }
    .panel-action { min-width: 40px; height: 40px; border: 1px solid var(--line); background: var(--deep); color: var(--paper); cursor: pointer; }

    .dream-list { display: grid; border-top: 1px solid var(--line); }
    .dream-row {
      min-height: 82px;
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    .dream-thumb { width: 48px; height: 48px; border: 1px solid var(--line); background: var(--slate); position: relative; overflow: hidden; }
    .dream-thumb::before { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); top: 8px; right: -5px; opacity: .8; }
    .dream-copy strong { display: block; font-size: 15px; font-weight: 600; }
    .dream-copy small { display: block; margin-top: 5px; color: var(--sage); font-size: 11px; }
    .dream-arrow { color: var(--sage); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sample-tag { color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }

    .capture-view { display: none; }
    .capture-view.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(32px, env(safe-area-inset-top)) 24px 30px; }
    .capture-state { color: var(--sage); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .mic-button {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 28px 0 22px;
      border: 1px solid rgba(231,223,197,.45);
      border-radius: 50%;
      background: var(--deep);
      color: var(--paper);
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 100ms ease;
    }
    .mic-button:active { transform: scale(.97); }
    .mic-button.recording { background: var(--danger); border-color: var(--paper); }
    .mic-icon { position: absolute; width: 22px; height: 37px; left: 54px; top: 37px; border: 3px solid currentColor; border-radius: 12px; }
    .mic-icon::after { content: ""; position: absolute; width: 34px; height: 24px; left: -9px; top: 18px; border: 3px solid currentColor; border-top: 0; border-radius: 0 0 18px 18px; }
    .mic-icon::before { content: ""; position: absolute; width: 3px; height: 13px; left: 7px; top: 40px; background: currentColor; box-shadow: -7px 10px 0 0 currentColor, 0 10px 0 0 currentColor, 7px 10px 0 0 currentColor; }
    .capture-timer { min-height: 34px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 26px; font-weight: 500; letter-spacing: .08em; }
    .capture-actions { width: 100%; max-width: 310px; display: grid; gap: 10px; margin-top: 34px; }
    .action-button { min-height: 52px; border: 1px solid var(--line); background: var(--deep); color: var(--paper); cursor: pointer; }
    .action-button.primary { background: var(--paper); color: var(--night); border-color: var(--paper); font-weight: 650; }
    .action-button:disabled { opacity: .35; cursor: default; }
    .capture-error { min-height: 36px; max-width: 300px; margin-top: 16px; color: #c99088; font-size: 12px; line-height: 1.4; text-align: center; }
    .capture-playback { display: none; width: min(100%, 320px); margin-top: 18px; }

    .settings-list { border-top: 1px solid var(--line); }
    .setting-row { min-height: 62px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 14px; }
    .setting-row span:last-child { color: var(--sage); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-transform: uppercase; }
    .toggle { width: 44px; height: 26px; padding: 3px; border: 1px solid var(--line); border-radius: 20px; background: var(--deep); cursor: pointer; }
    .toggle::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--sage); transition: transform 180ms ease, background 180ms ease; }
    .toggle.on::after { transform: translateX(16px); background: var(--paper); }

    .nav {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(78px + env(safe-area-inset-bottom));
      padding: 8px 8px env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(13,19,33,.94);
      backdrop-filter: blur(12px);
    }
    .nav-button {
      position: relative;
      min-height: 60px;
      border: 0;
      background: transparent;
      color: #65746f;
      cursor: pointer;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
    }
    .nav-button[aria-selected="true"] { color: var(--paper); }
    .nav-button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; width: 18px; height: 2px; background: var(--gold); }
    .nav-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .nav-icon { position: relative; width: 22px; height: 22px; }
    .icon-world { border: 2px solid currentColor; border-radius: 50%; }
    .icon-world::before { content: ""; position: absolute; left: 4px; right: 4px; top: 9px; border-top: 2px solid currentColor; }
    .icon-world::after { content: ""; position: absolute; top: 3px; bottom: 3px; left: 9px; border-left: 2px solid currentColor; }
    .icon-dreams { border: 2px solid currentColor; }
    .icon-dreams::before, .icon-dreams::after { content: ""; position: absolute; left: 4px; right: 4px; border-top: 2px solid currentColor; }
    .icon-dreams::before { top: 6px; } .icon-dreams::after { top: 12px; }
    .icon-capture { border: 2px solid currentColor; border-radius: 50%; }
    .icon-capture::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: currentColor; }
    .icon-settings::before, .icon-settings::after { content: ""; position: absolute; left: 1px; right: 1px; border-top: 2px solid currentColor; }
    .icon-settings::before { top: 6px; box-shadow: 0 9px 0 currentColor; }
    .icon-settings::after { width: 5px; height: 5px; top: 3px; left: 5px; border: 2px solid currentColor; border-radius: 50%; background: var(--night); box-shadow: 8px 9px 0 -1px var(--night), 8px 9px 0 1px currentColor; }

    @keyframes boot-away {
      0% { opacity: 1; clip-path: inset(0 0 0 0); }
      70% { opacity: 1; clip-path: inset(0 0 0 0); }
      100% { opacity: 0; clip-path: inset(0 0 100% 0); visibility: hidden; }
    }
    @keyframes mark-pulse { 50% { transform: rotate(45deg) scale(.86); opacity: .7; } }
    @keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ring { from { transform: scale(.4); opacity: .5; } to { transform: scale(1.4); opacity: 0; } }
    @keyframes drift { 50% { transform: translateX(5px); } }

    .mist { animation: drift 9s ease-in-out infinite; }
    .mist.two { animation-duration: 13s; animation-direction: reverse; }

    @media (min-width: 431px) {
      body { display: grid; place-items: center; background: #080c14; }
      .app { height: min(880px, calc(100dvh - 24px)); border: 1px solid var(--line); box-shadow: 0 28px 80px rgba(0,0,0,.45); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .boot { display: none; }
    }
  </style>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"></div></div>

  <main class="app" id="app" data-phase="night" aria-label="Dreamworld prototype">
    <section class="view world-view active" id="worldView" data-view="world" aria-label="Current dream world">
      <div class="world-scene">
        <svg viewBox="0 0 430 780" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A quiet pixel-art island beneath a crescent moon">
          <rect width="430" height="780" fill="#0d1321"/>
          <g class="stars-layer">
            <rect x="35" y="86" width="3" height="3" fill="#e7dfc5"/>
            <rect x="84" y="145" width="2" height="2" fill="#8ea096"/>
            <rect x="139" y="73" width="2" height="2" fill="#b69a63"/>
            <rect x="260" y="112" width="3" height="3" fill="#e7dfc5"/>
            <rect x="342" y="158" width="2" height="2" fill="#8ea096"/>
            <rect x="390" y="93" width="3" height="3" fill="#b69a63"/>
          </g>
          <g class="moon-body">
            <rect x="319" y="65" width="62" height="62" fill="#d8cfad"/>
            <rect x="303" y="81" width="62" height="62" fill="#0d1321"/>
          </g>
          <g class="sun-body">
            <rect x="319" y="65" width="48" height="48" fill="#d8cfad"/>
            <rect x="311" y="73" width="64" height="32" fill="#d8cfad"/>
            <rect x="327" y="57" width="32" height="64" fill="#d8cfad"/>
          </g>

          <polygon points="0,350 66,282 132,350" fill="#182434"/>
          <polygon points="73,350 170,238 267,350" fill="#1c2a39"/>
          <polygon points="212,350 316,260 430,350" fill="#172332"/>
          <polygon points="116,350 214,278 312,350" fill="#243443"/>
          <rect x="0" y="350" width="430" height="430" fill="#111b29"/>

          <g class="mist" opacity=".55" fill="#3e5b57">
            <rect x="-30" y="379" width="175" height="7"/><rect x="65" y="372" width="116" height="7"/>
          </g>
          <g class="mist two" opacity=".32" fill="#8ea096">
            <rect x="232" y="408" width="174" height="5"/><rect x="347" y="401" width="94" height="5"/>
          </g>

          <polygon points="76,512 122,475 161,465 187,429 234,414 270,436 312,451 348,493 367,520 332,535 101,535" fill="#233242"/>
          <polygon points="98,497 137,465 178,456 195,429 232,418 265,440 304,455 343,497" fill="#3e5b57"/>
          <rect x="101" y="497" width="242" height="13" fill="#314844"/>
          <polygon points="101,510 343,510 321,551 127,551" fill="#18252f"/>
          <polygon points="127,551 321,551 282,589 165,589" fill="#14202a"/>

          <g fill="#8ea096">
            <rect x="128" y="453" width="5" height="44"/>
            <rect x="117" y="451" width="28" height="6"/>
            <rect x="120" y="441" width="22" height="7"/>
            <rect x="125" y="431" width="14" height="8"/>
            <rect x="112" y="459" width="17" height="6"/>
            <rect x="134" y="462" width="17" height="6"/>
          </g>

          <g fill="#697b70">
            <rect x="218" y="446" width="12" height="55"/>
            <rect x="263" y="446" width="12" height="55"/>
            <rect x="218" y="436" width="57" height="12"/>
            <rect x="227" y="421" width="39" height="15"/>
            <rect x="234" y="413" width="25" height="8"/>
          </g>
          <rect x="230" y="458" width="33" height="43" fill="#111b29"/>
          <rect x="239" y="458" width="15" height="4" fill="#b69a63"/>

          <rect x="0" y="590" width="430" height="190" fill="#0d1622"/>
          <rect x="0" y="618" width="430" height="2" fill="#233242"/>
          <rect x="0" y="660" width="430" height="2" fill="#1c2937"/>
          <rect x="87" y="631" width="80" height="2" fill="#314844"/>
          <rect x="268" y="645" width="94" height="2" fill="#314844"/>
          <rect x="145" y="704" width="140" height="2" fill="#233242"/>

          <g opacity=".35" transform="translate(0,112)">
            <polygon points="127,551 321,551 282,589 165,589" fill="#233242"/>
            <rect x="230" y="458" width="33" height="43" fill="#3e5b57" transform="translate(0,130) scale(1,-1) translate(0,-959)"/>
          </g>
        </svg>
        <div class="phase-wash" aria-hidden="true"></div>
      </div>

      <div class="world-hud">
        <span class="world-id">World 01</span>
        <span class="world-progress" id="worldPhase">Night · 2 places</span>
      </div>
      <button class="hotspot hotspot-arch" data-place="The Quiet Gate" data-kind="Dream landmark" aria-label="Open The Quiet Gate"></button>
      <button class="hotspot hotspot-tree" data-place="Pale Tree" data-kind="Recurring symbol" aria-label="Open Pale Tree"></button>
      <div class="world-sheet" id="worldSheet" aria-live="polite">
        <div><small id="placeKind">Dream landmark</small><strong id="placeName">The Quiet Gate</strong></div>
        <button class="sheet-close" id="sheetClose" aria-label="Close">×</button>
      </div>
    </section>

    <section class="view panel-view" id="dreamsView" data-view="dreams">
      <header class="panel-head"><h1 class="panel-title">Dreams</h1><button class="panel-action" data-go="capture" aria-label="Record a dream">＋</button></header>
      <div class="dream-list">
        <a class="dream-row" href="#" aria-label="Sample dream entry">
          <span class="dream-thumb"></span>
          <span class="dream-copy"><strong>Ocean House</strong><small>Sample entry · 0:48</small></span>
          <span><span class="sample-tag">Sample</span><span class="dream-arrow"> ›</span></span>
        </a>
        <a class="dream-row" href="#" aria-label="Sample dream entry">
          <span class="dream-thumb"></span>
          <span class="dream-copy"><strong>The Quiet Gate</strong><small>Sample entry · 1:12</small></span>
          <span><span class="sample-tag">Sample</span><span class="dream-arrow"> ›</span></span>
        </a>
      </div>
    </section>

    <section class="view capture-view" id="captureView" data-view="capture">
      <span class="capture-state" id="captureState">Ready</span>
      <button class="mic-button" id="micButton" aria-label="Start recording"><span class="mic-icon" aria-hidden="true"></span></button>
      <div class="capture-timer" id="captureTimer">00:00</div>
      <audio class="capture-playback" id="capturePlayback" controls></audio>
      <div class="capture-error" id="captureError" role="alert"></div>
      <div class="capture-actions">
        <button class="action-button primary" id="saveButton" disabled>Save dream</button>
        <button class="action-button" id="noDreamButton">No dream remembered</button>
      </div>
    </section>

    <section class="view panel-view" id="settingsView" data-view="settings">
      <header class="panel-head"><h1 class="panel-title">Settings</h1></header>
      <div class="settings-list">
        <div class="setting-row"><span>Wake alarm</span><button class="toggle on" aria-label="Toggle wake alarm" aria-pressed="true"></button></div>
        <div class="setting-row"><span>Sound cues</span><button class="toggle" aria-label="Toggle sound cues" aria-pressed="false"></button></div>
        <div class="setting-row"><span>Local audio</span><span>On</span></div>
        <div class="setting-row"><span>Analysis timing</span><span>Later</span></div>
      </div>
    </section>

    <nav class="nav" aria-label="Primary navigation">
      <button class="nav-button" data-go="world" aria-selected="true"><span class="nav-icon icon-world"></span><span class="nav-label">World</span></button>
      <button class="nav-button" data-go="dreams" aria-selected="false"><span class="nav-icon icon-dreams"></span><span class="nav-label">Dreams</span></button>
      <button class="nav-button" data-go="capture" aria-selected="false"><span class="nav-icon icon-capture"></span><span class="nav-label">Capture</span></button>
      <button class="nav-button" data-go="settings" aria-selected="false"><span class="nav-icon icon-settings"></span><span class="nav-label">Settings</span></button>
    </nav>
  </main>

  <script>
    const views = [...document.querySelectorAll('.view')];
    const navButtons = [...document.querySelectorAll('.nav-button')];
    const micButton = document.getElementById('micButton');
    const captureState = document.getElementById('captureState');
    const captureTimer = document.getElementById('captureTimer');
    const captureError = document.getElementById('captureError');
    const capturePlayback = document.getElementById('capturePlayback');
    const saveButton = document.getElementById('saveButton');

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let timer = null;
    let startedAt = 0;
    let audioUrl = null;
    let hasCapture = false;

    function getTimePhase(hour) {
      if (hour >= 5 && hour < 6) return { id: 'blue-hour', label: 'Blue hour' };
      if (hour >= 6 && hour < 8) return { id: 'sunrise', label: 'Sunrise' };
      if (hour >= 8 && hour < 11) return { id: 'morning', label: 'Morning' };
      if (hour >= 11 && hour < 14) return { id: 'noon', label: 'Noon' };
      if (hour >= 14 && hour < 17) return { id: 'afternoon', label: 'Afternoon' };
      if (hour >= 17 && hour < 19) return { id: 'golden-hour', label: 'Golden hour' };
      if (hour >= 19 && hour < 21) return { id: 'sunset', label: 'Sunset' };
      return { id: 'night', label: 'Night' };
    }

    function applyTimePhase(date = new Date()) {
      const phase = getTimePhase(date.getHours() + date.getMinutes() / 60);
      document.getElementById('app').dataset.phase = phase.id;
      document.getElementById('worldPhase').textContent = `${phase.label} · 2 places`;
    }

    function openView(name) {
      views.forEach(view => view.classList.toggle('active', view.dataset.view === name));
      navButtons.forEach(button => button.setAttribute('aria-selected', String(button.dataset.go === name)));
    }

    function updateTimer() {
      const elapsed = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      captureTimer.textContent = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
    }

    function stopTracks() {
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    function finishRecording() {
      window.clearInterval(timer);
      timer = null;
      stopTracks();
      micButton.classList.remove('recording');
      micButton.setAttribute('aria-label', 'Start another recording');
      captureState.textContent = 'Ready to save';
      hasCapture = true;
      saveButton.disabled = false;

      if (chunks.length) {
        const blob = new Blob(chunks, { type: mediaRecorder?.mimeType || 'audio/mp4' });
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(blob);
        capturePlayback.src = audioUrl;
        capturePlayback.style.display = 'block';
      }
    }

    async function startRecording() {
      captureError.textContent = '';
      chunks = [];
      hasCapture = false;
      saveButton.disabled = true;
      capturePlayback.style.display = 'none';

      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        captureState.textContent = 'Simulation';
        micButton.classList.add('recording');
        startedAt = Date.now();
        timer = window.setInterval(updateTimer, 250);
        mediaRecorder = null;
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.addEventListener('dataavailable', event => { if (event.data.size) chunks.push(event.data); });
        mediaRecorder.addEventListener('stop', finishRecording, { once: true });
        mediaRecorder.start(400);
        startedAt = Date.now();
        timer = window.setInterval(updateTimer, 250);
        micButton.classList.add('recording');
        micButton.setAttribute('aria-label', 'Stop recording');
        captureState.textContent = 'Listening';
        if (navigator.vibrate) navigator.vibrate(30);
      } catch (error) {
        captureState.textContent = 'Microphone off';
        captureError.textContent = 'Microphone access is off. Enable it in Safari settings and try again.';
        stopTracks();
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      } else {
        finishRecording();
      }
    }

    function toggleRecording() {
      if (micButton.classList.contains('recording')) stopRecording();
      else startRecording();
    }

    function saveDream() {
      if (!hasCapture) return;
      localStorage.setItem('dreamworld:worldFirstLastDream', new Date().toISOString());
      captureState.textContent = 'Saved';
      saveButton.disabled = true;
      if (navigator.vibrate) navigator.vibrate([30, 30, 60]);
      window.setTimeout(() => openView('world'), 500);
    }

    function logNoDream() {
      localStorage.setItem('dreamworld:worldFirstNoRecall', new Date().toISOString());
      captureState.textContent = 'Logged';
      window.setTimeout(() => openView('world'), 450);
    }

    document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => openView(button.dataset.go)));
    document.querySelectorAll('.hotspot').forEach(button => button.addEventListener('click', () => {
      document.getElementById('placeName').textContent = button.dataset.place;
      document.getElementById('placeKind').textContent = button.dataset.kind;
      document.getElementById('worldSheet').classList.add('visible');
    }));
    document.getElementById('sheetClose').addEventListener('click', () => document.getElementById('worldSheet').classList.remove('visible'));
    document.querySelectorAll('.toggle').forEach(button => button.addEventListener('click', () => {
      const on = button.classList.toggle('on');
      button.setAttribute('aria-pressed', String(on));
    }));
    document.querySelectorAll('.dream-row').forEach(link => link.addEventListener('click', event => event.preventDefault()));
    micButton.addEventListener('click', toggleRecording);
    saveButton.addEventListener('click', saveDream);
    document.getElementById('noDreamButton').addEventListener('click', logNoDream);
    applyTimePhase();
    window.setInterval(applyTimePhase, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) applyTimePhase(); });
    window.DreamworldDayCycle = { getTimePhase, applyTimePhase };
  </script>
</body>
</html>
